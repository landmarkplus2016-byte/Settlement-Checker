<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Settlement Checker">
  <!--
    The maskable variant. Android crops an installed icon to whatever shape the
    launcher uses — circle, squircle, teardrop — so the background runs edge to
    edge and everything that must survive stays inside the safe zone: the centre
    circle of radius 40% (205px), i.e. well within 102px of every edge.

    Same token values as icon.svg; keep the two in step.
  -->
  <rect width="512" height="512" fill="#0f1942"/>

  <rect x="176" y="330" width="160" height="22" rx="11" fill="#3d5af1"/>

  <text x="256" y="298" fill="#ffffff"
        font-family="'Segoe UI', system-ui, -apple-system, Tahoma, sans-serif"
        font-size="164" font-weight="800" letter-spacing="3"
        text-anchor="middle">SC</text>
</svg>
