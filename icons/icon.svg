<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Settlement Checker">
  <!--
    The app icon (CLAUDE.md 8.3). Colours are the tokens, by value — an SVG file
    cannot read css/tokens.css, so these two literals and the two in
    manifest.json are the only place a brand colour is written down twice.
    If a token changes, change them here too:
      #0f1942  --color-navy
      #3d5af1  --color-primary
      #ffffff  --color-text-inverse
  -->
  <rect width="512" height="512" rx="112" fill="#0f1942"/>

  <!-- The indigo action colour, as the mark's underline. -->
  <rect x="140" y="358" width="232" height="26" rx="13" fill="#3d5af1"/>

  <text x="256" y="316" fill="#ffffff"
        font-family="'Segoe UI', system-ui, -apple-system, Tahoma, sans-serif"
        font-size="216" font-weight="800" letter-spacing="4"
        text-anchor="middle">SC</text>
</svg>
