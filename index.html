<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Settlement Checker — expense and fuel settlement for the telecom operations team.">

  <!-- The visible title is replaced at boot from get_config.app_name (js/main.js). -->
  <title>Settlement Checker</title>

  <!--
    PWA (CLAUDE.md 9.2). Relative, like every other path here: GitHub Pages
    serves a project repo from a subdirectory, not the domain root.

    The icons are PNG rather than SVG because that is what installability
    actually turns on: a browser looks for a 192px and a 512px raster icon
    before it offers to install, and iOS only reads apple-touch-icon — which it
    also composites onto black, so that one has the off-white ground baked in
    rather than transparency.

    There is no <meta name="theme-color"> hex here on purpose — js/main.js sets
    it from --color-navy so the browser chrome cannot drift from the tokens
    (rule 23). manifest.json has to carry its own literals; JSON cannot read CSS.
  -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180">

  <!-- Design tokens first: every other stylesheet reads from them. -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/grid.css">
  <link rel="stylesheet" href="css/template.css">
  <link rel="stylesheet" href="css/print.css" media="print">

  <!--
    xlsx-js-style, pinned. The only third-party dependency in the project and the
    only <script> that is not one of ours (CLAUDE.md, Tech Stack). Not a module —
    it publishes the global `XLSX`, which js/utils/xlsx.js wraps.

    It is SheetJS with cell styling added. Plain SheetJS writes values, merges
    and column widths but drops fonts, fills and borders, which left the finance
    file looking nothing like the preview it mirrors (7.2). Same API, so the
    Site→JC import reads through it unchanged.

    `xlsx.bundle.js` rather than `xlsx.min.js`: the bundle carries the codepage
    tables, the way SheetJS's `xlsx.full.min.js` did before it. Without them a
    legacy .xls dropped on the Site→JC import fails to read.
  -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
</head>
<body>
  <div id="app"></div>

  <!-- The whole app boots from here; every other file is imported as a module. -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
